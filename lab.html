<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>实验台 · 心理表象经典范式复现</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 600px at 50% -12%, #101b2c 0%, #080b10 62%);
  color:#e8eef7;min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 44px}
header{margin-bottom:16px}
h1{font-size:19px;margin:0 0 4px;letter-spacing:.4px}
h1 span{color:#a78bfa}
.sub{font-size:12px;color:#7d8ea6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{
  background:#111823;border:1px solid #22304a;color:#7d8ea6;
  padding:8px 14px;border-radius:11px;font-size:13px;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.tab:hover{border-color:#33445e;color:#c7d4e5}
.tab.active{background:linear-gradient(140deg,#a78bfa,#818cf8);color:#0d0820;border-color:transparent;font-weight:600}
.panel{background:rgba(17,24,35,.85);border:1px solid #22304a;border-radius:20px;padding:20px}
.hud{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#111823;border:1px solid #22304a;border-radius:10px;padding:6px 12px;font-size:12px;color:#7d8ea6}
.chip b{color:#e8eef7;font-variant-numeric:tabular-nums}
#stage{min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.hidden{display:none!important}
.method{max-width:600px}
.method h3{margin:0 0 10px;font-size:15px}
.method p{font-size:13px;line-height:1.9;color:#8b9bb0;margin:0 0 10px}
.method b{color:#c7d4e5}
.method .cite{font-size:11.5px;color:#5c6f88;font-style:italic}
.btn{
  padding:13px 30px;border-radius:13px;border:none;cursor:pointer;
  background:linear-gradient(140deg,#a78bfa,#818cf8);color:#0d0820;
  font-size:14px;font-weight:600;font-family:inherit;transition:all .13s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.instr{text-align:center;font-size:14px;line-height:1.7;color:#c3d0e2;margin-bottom:14px;min-height:24px}
.instr em{color:#a78bfa;font-style:normal;font-weight:600}
.instr b{color:#e8eef7}
canvas{display:block;border-radius:16px;border:1px solid #1b2637;background:#0b1017;max-width:100%;margin:0 auto}
.answers{display:flex;gap:12px;justify-content:center;width:100%;max-width:420px}
.answers button{
  flex:1;padding:15px;border-radius:14px;border:1px solid #22304a;background:#141d29;
  color:#e8eef7;font-size:15px;cursor:pointer;font-family:inherit;transition:all .13s;
}
.answers button:hover{background:#1a2634;border-color:#34506f}
.answers button:active{transform:scale(.97)}
.answers button small{display:block;color:#5c6f88;font-size:11px;margin-top:3px}
.grid{
  display:grid;grid-template-columns:repeat(var(--n),1fr);grid-auto-rows:1fr;
  gap:5px;width:100%;max-width:300px;margin:0 auto;padding:8px;
  background:#0d141d;border-radius:16px;border:1px solid #1b2637;aspect-ratio:1;
}
.cell{border-radius:8px;background:#0a1017;border:1px solid #18222f;transition:all .12s}
.cell.on{background:linear-gradient(140deg,#5eead4,#22d3ee);border-color:transparent}
.cell.sel{background:linear-gradient(140deg,#a78bfa,#c084fc);border-color:transparent}
.cell.hit{background:linear-gradient(140deg,#34d399,#10b981);border-color:transparent}
.cell.err{background:linear-gradient(140deg,#f87171,#ef4444);border-color:transparent}
.cell.miss{border:2px dashed #fbbf24}
.cell.clickable{cursor:pointer}
.cell.clickable:hover{background:#131c27}
.cell.creaseV{border-right:3px dashed #fbbf24}
.cell.creaseH{border-bottom:3px dashed #fbbf24}
.fb{text-align:center;font-size:14px;min-height:22px;font-weight:600}
.fb.ok{color:#34d399}.fb.bad{color:#f87171}
.res{max-width:600px;width:100%}
.res h3{font-size:15px;margin:0 0 4px}
.res .hint{font-size:12px;color:#5c6f88;margin-bottom:14px}
.note{font-size:12.5px;color:#8b9bb0;line-height:1.9;background:#0c131c;border-left:2px solid #a78bfa;border-radius:0 10px 10px 0;padding:11px 13px;margin:12px 0}
.note b{color:#c7d4e5}
table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid #1b2637;font-variant-numeric:tabular-nums}
th{color:#5c6f88;font-weight:500;font-size:11px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.stat{background:#0c131c;border:1px solid #1b2637;border-radius:13px;padding:12px}
.stat .k{font-size:11px;color:#5c6f88;margin-bottom:5px}
.stat .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;color:#5c6f88;font-weight:400;margin-left:2px}
footer{text-align:center;margin-top:18px;font-size:11px;color:#3a4759}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>实验台 <span>·</span> 心理表象经典范式复现</h1>
    <div class="sub">Cooper–Shepard 1973 / Freyd 1993 / Shepard–Feng 1972</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-exp="1">① 字符旋转</button>
    <button class="tab" data-exp="2">② 表征动量</button>
    <button class="tab" data-exp="3">③ 心理折叠</button>
  </div>

  <div class="hud">
    <div class="chip">试次 <b id="hTrial">—</b></div>
    <div class="chip">阶段 <b id="hPhase">说明</b></div>
  </div>

  <div class="panel">
    <div class="instr" id="instr"></div>
    <div id="stage"></div>
  </div>

  <footer>三个范式均为原始程序的网页化重写，参数取自原论文的常用设置</footer>
</div>

<script>
var $=function(s){return document.querySelector(s)};
var randInt=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var K=function(r,c){return r+','+c};
var pk=function(k){return k.split(',').map(Number)};
var shuffle=function(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};

var rafId=null, timers=[];
function after(ms,fn){var t=setTimeout(fn,ms);timers.push(t);return t;}
function clearAll(){
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
  timers.forEach(clearTimeout);timers=[];
}
function setPhase(t){$('#hPhase').textContent=t;}
function setTrial(t){$('#hTrial').textContent=t;}

/* ============ 实验一：Cooper & Shepard (1973) ============ */
var E1={i:0,total:24,angle:0,mirror:false,t0:0,phase:'idle',block:[],data:[]};
var ANGLES=[0,60,120,180,240,300];

function e1Intro(){
  clearAll();
  setPhase('说明');setTrial('—');
  $('#instr').textContent='';
  $('#stage').innerHTML=
    '<div class="method">'+
    '<h3>实验一 · 字符旋转</h3>'+
    '<p><b>程序：</b>屏幕中央出现一个字母 <b>R</b>，它可能是<b>正写</b>，也可能是<b>左右镜像</b>，'+
    '并且被旋转了 0°、60°、120°、180°、240° 或 300°。你的任务是判断它是正写还是镜像。</p>'+
    '<p><b>经典结果：</b>判断时间随旋转角度<b>线性增长</b>，斜率反映“转”的速度；'+
    '并且 0° 与 180° 会明显快于其他角度（正立与倒立是“锚点”）。</p>'+
    '<p><b>共 24 试次</b>，每个角度 4 次。按 F / ← 判“正写”，J / → 判“镜像”。</p>'+
    '<div class="cite">Cooper, L. A., &amp; Shepard, R. N. (1973). Chronometric studies of the rotation of mental images.</div>'+
    '</div>'+
    '<button class="btn" id="e1start">开始实验</button>';
  $('#e1start').addEventListener('click',function(){
    E1.i=0;E1.data=[];E1.block=[];
    setTrial('0/24');
    e1Trial();
  });
}
function e1Angle(){
  if(!E1.block.length)E1.block=shuffle(ANGLES.slice());
  return E1.block.pop();
}
function e1Trial(){
  clearAll();
  if(E1.i>=E1.total){e1Result();return;}
  E1.angle=e1Angle();
  E1.mirror=Math.random()<0.5;
  E1.phase='run';
  $('#instr').innerHTML='这是<em>正写</em>还是<em>镜像</em>？';
  var st=$('#stage');
  st.innerHTML='<canvas id="e1cv" width="300" height="300"></canvas>'+
    '<div class="answers">'+
    '<button data-a="normal">正写<small>F / ←</small></button>'+
    '<button data-a="mirror">镜像<small>J / →</small></button></div>'+
    '<div class="fb" id="e1fb"></div>';
  drawChar();
  st.querySelectorAll('.answers button').forEach(function(b){
    b.addEventListener('click',function(){e1Answer(b.dataset.a==='mirror');});
  });
  E1.t0=performance.now();
}
function drawChar(){
  var cv=$('#e1cv');if(!cv)return;
  var ctx=cv.getContext('2d');
  var w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  ctx.save();
  ctx.translate(w/2,h/2);
  ctx.rotate(E1.angle*Math.PI/180);
  if(E1.mirror)ctx.scale(-1,1);
  ctx.font='bold 150px -apple-system,"Segoe UI",Helvetica,Arial,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#a78bfa';
  ctx.fillText('R',0,6);
  ctx.restore();
}
function e1Answer(saysMirror){
  if(E1.phase!=='run')return;
  E1.phase='fb';
  var rt=performance.now()-E1.t0;
  var correct=(saysMirror===E1.mirror);
  E1.data.push({angle:E1.angle,rt:rt,correct:correct});
  var fb=$('#e1fb');
  fb.className='fb '+(correct?'ok':'bad');
  fb.textContent=(correct?'✓ ':'✗ ')+(E1.mirror?'镜像':'正写')+' · '+(rt|0)+'ms';
  E1.i++;setTrial(E1.i+'/'+E1.total);
  after(520,e1Trial);
}
function e1Result(){
  clearAll();
  setPhase('结果');
  var d=E1.data;
  if(!d.length){e1Intro();return;}
  var acc=Math.round(d.filter(function(x){return x.correct}).length/d.length*100);
  var byAngle=ANGLES.map(function(a){
    var g=d.filter(function(x){return x.angle===a&&x.correct});
    return {a:a,rt:g.length?g.reduce(function(s,x){return s+x.rt},0)/g.length:null,n:g.length};
  });
  var pts=byAngle.filter(function(p){return p.rt!==null});
  var fit=linreg(pts.map(function(p){return p.a}),pts.map(function(p){return p.rt}));
  var speed=fit&&fit.slope>0?Math.round(1000/fit.slope):null;
  var r0=byAngle[0].rt,r180=byAngle[3].rt;
  var mid=pts.filter(function(p){return p.a!==0&&p.a!==180});
  var midAvg=mid.length?mid.reduce(function(s,p){return s+p.rt},0)/mid.length:null;

  var chart=pts.length?svgLine(pts.map(function(p){return {x:p.a,y:p.rt}}),'角度 (°)','RT (ms)'):'';

  var html='<div class="res"><h3>结果</h3>'+
    '<div class="hint">共 '+d.length+' 试次 · 正确率 '+acc+'%</div>'+
    chart+
    '<table><tr><th>角度</th><th>试次</th><th>平均 RT</th></tr>'+
    byAngle.map(function(p){
      return '<tr><td>'+p.a+'°</td><td>'+p.n+'</td><td>'+(p.rt===null?'—':(p.rt|0)+'ms')+'</td></tr>';
    }).join('')+'</table>';

  if(speed){
    html+='<div class="statGrid">'+
      '<div class="stat"><div class="k">旋转速度（斜率反推）</div><div class="v">'+speed+'<small>°/秒</small></div></div>'+
      '<div class="stat"><div class="k">均值 RT</div><div class="v">'+Math.round(pts.reduce(function(s,p){return s+p.rt},0)/pts.length)+'<small>ms</small></div></div>'+
      '</div>';
  }
  if(r0&&r180&&midAvg){
    var adv=Math.round(midAvg-(r0+r180)/2);
    html+='<div class="note">锚点效应：0° 与 180° 的平均 RT 比中间角度快约 <b>'+adv+'ms</b>。'+
      (adv>40?'存在明显的正立/倒立优势，与 Cooper–Shepard 的原始结果一致。'
        :'优势不明显——可能试次较少，或你采用了特征匹配而非整体旋转。')+'</div>';
  }
  html+='<div class="note"><b>怎么看：</b>RT 随角度单调上升，说明你在连续旋转图像；斜率越陡转得越慢。'+
    '斜率接近 0 说明你可能是逐个特征比对（只看 R 的“腿”朝向），这更快，但不属于整体旋转。</div>'+
    '<button class="btn" id="e1again">再测一次</button></div>';
  $('#instr').textContent='';
  $('#stage').innerHTML=html;
  $('#e1again').addEventListener('click',e1Intro);
}

/* ============ 实验二：Freyd (1993) 表征动量 ============ */
var E2={i:0,total:18,speeds:[180,340,560],data:[],phase:'idle',
  A:null,B:null,vanish:null,dir:null,speed:0,t0:0,dur:0,W:0,H:0,ctx:null};

function e2Intro(){
  clearAll();
  setPhase('说明');setTrial('—');
  $('#instr').textContent='';
  $('#stage').innerHTML=
    '<div class="method">'+
    '<h3>实验二 · 表征动量</h3>'+
    '<p><b>程序：</b>一个圆点沿固定方向匀速运动，在随机位置突然消失。'+
    '请用鼠标或手指<b>点在你认为它消失的位置</b>。</p>'+
    '<p><b>经典结果：</b>人们报告的消失位置会系统性地<b>偏向运动方向</b>（前移误差），'+
    '而且速度越快，前移越大。这说明心理表征自带“惯性”，不是静态快照。</p>'+
    '<p><b>共 18 试次</b>，三档速度各 6 次。</p>'+
    '<div class="cite">Freyd, J. J. (1993). Five hunches about perceptual processes.</div>'+
    '</div>'+
    '<button class="btn" id="e2start">开始实验</button>';
  $('#e2start').addEventListener('click',function(){
    E2.i=0;E2.data=[];
    setTrial('0/18');
    e2Trial();
  });
}
function e2Trial(){
  clearAll();
  if(E2.i>=E2.total){e2Result();return;}
  E2.phase='move';
  $('#instr').innerHTML='盯住圆点，记住它<b>消失</b>的位置';
  var st=$('#stage');
  st.innerHTML='<canvas id="e2cv" style="width:100%;max-width:560px;aspect-ratio:4/3"></canvas>'+
    '<div class="fb" id="e2fb"></div>';
  var cv=$('#e2cv');
  var rect=cv.getBoundingClientRect();
  var dpr=window.devicePixelRatio||1;
  cv.width=Math.round(rect.width*dpr);cv.height=Math.round(rect.height*dpr);
  var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
  E2.W=rect.width;E2.H=rect.height;E2.ctx=ctx;

  var W=E2.W,H=E2.H;
  var ang=Math.random()*Math.PI*2;
  var cx=W/2,cy=H/2;
  var half=Math.min(W,H)*0.36;
  var A={x:cx-Math.cos(ang)*half,y:cy-Math.sin(ang)*half};
  var B={x:cx+Math.cos(ang)*half,y:cy+Math.sin(ang)*half};
  E2.A=A;E2.B=B;
  E2.dir={x:Math.cos(ang),y:Math.sin(ang)};
  var f=0.5+Math.random()*0.2;
  E2.vanish={x:A.x+(B.x-A.x)*f,y:A.y+(B.y-A.y)*f};
  var dist=Math.hypot(B.x-A.x,B.y-A.y)*f;
  E2.speed=E2.speeds[E2.i%E2.speeds.length];
  E2.dur=Math.max(420,Math.min(2400,dist/E2.speed*1000));
  E2.startT=0;

  function loop(now){
    if(E2.phase!=='move')return;
    if(!E2.startT)E2.startT=now;
    var t=(now-E2.startT);
    var prog=t/E2.dur;
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(130,150,180,.10)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
    if(prog>=1){e2Vanish();return;}
    var x=A.x+(E2.vanish.x-A.x)*prog;
    var y=A.y+(E2.vanish.y-A.y)*prog;
    ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);
    ctx.fillStyle='#38bdf8';ctx.fill();
    ctx.shadowColor='rgba(56,189,248,.8)';ctx.shadowBlur=18;
    ctx.fill();ctx.shadowBlur=0;
    rafId=requestAnimationFrame(loop);
  }
  rafId=requestAnimationFrame(loop);
}
function e2Vanish(){
  E2.phase='respond';
  var ctx=E2.ctx;
  ctx.clearRect(0,0,E2.W,E2.H);
  ctx.strokeStyle='rgba(130,150,180,.10)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(E2.A.x,E2.A.y);ctx.lineTo(E2.B.x,E2.B.y);ctx.stroke();
  $('#instr').innerHTML='点在你认为它<em>消失</em>的位置';
  var cv=$('#e2cv');
  cv.style.cursor='crosshair';
  E2.t0=performance.now();
  cv.onclick=function(ev){
    var r=cv.getBoundingClientRect();
    e2Answer(ev.clientX-r.left,ev.clientY-r.top);
  };
  cv.ontouchend=function(ev){
    ev.preventDefault();
    var t=ev.changedTouches[0];
    var r=cv.getBoundingClientRect();
    e2Answer(t.clientX-r.left,t.clientY-r.top);
  };
}
function e2Answer(x,y){
  if(E2.phase!=='respond')return;
  E2.phase='fb';
  var cv=$('#e2cv');
  cv.onclick=null;cv.ontouchend=null;
  cv.style.cursor='default';
  var dx=x-E2.vanish.x, dy=y-E2.vanish.y;
  var along=dx*E2.dir.x+dy*E2.dir.y;
  var perp=Math.abs(-dx*E2.dir.y+dy*E2.dir.x);

  var ctx=E2.ctx;
  ctx.clearRect(0,0,E2.W,E2.H);
  ctx.strokeStyle='rgba(130,150,180,.10)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(E2.A.x,E2.A.y);ctx.lineTo(E2.B.x,E2.B.y);ctx.stroke();

  ctx.beginPath();ctx.arc(E2.vanish.x,E2.vanish.y,9,0,Math.PI*2);
  ctx.strokeStyle='#34d399';ctx.lineWidth=2.5;ctx.stroke();

  ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);
  ctx.fillStyle='#f87171';ctx.fill();

  ctx.beginPath();ctx.moveTo(E2.vanish.x,E2.vanish.y);ctx.lineTo(x,y);
  ctx.strokeStyle='rgba(251,191,36,.75)';ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);

  var ax=E2.vanish.x+E2.dir.x*44, ay=E2.vanish.y+E2.dir.y*44;
  ctx.beginPath();ctx.moveTo(ax,ay);
  ctx.lineTo(ax-E2.dir.x*13-E2.dir.y*7, ay-E2.dir.y*13+E2.dir.x*7);
  ctx.lineTo(ax-E2.dir.x*13+E2.dir.y*7, ay-E2.dir.y*13-E2.dir.x*7);
  ctx.closePath();ctx.fillStyle='rgba(56,189,248,.8)';ctx.fill();

  var fb=$('#e2fb');
  fb.className='fb';
  fb.style.color=along>0?'#34d399':'#f87171';
  fb.textContent=(along>=0?'前移 ':'后移 ')+Math.round(Math.abs(along))+'px';

  E2.data.push({speed:E2.speed,along:along,perp:perp,rt:performance.now()-E2.t0});
  E2.i++;setTrial(E2.i+'/'+E2.total);
  after(1150,e2Trial);
}
function e2Result(){
  clearAll();
  setPhase('结果');
  var d=E2.data;
  if(!d.length){e2Intro();return;}
  var groups=[180,340,560].map(function(s){
    var g=d.filter(function(x){return x.speed===s});
    return {s:s,n:g.length,
      along:g.length?g.reduce(function(a,x){return a+x.along},0)/g.length:null,
      perp:g.length?g.reduce(function(a,x){return a+x.perp},0)/g.length:null};
  });
  var all=d.reduce(function(a,x){return a+x.along},0)/d.length;
  var html='<div class="res"><h3>结果</h3>'+
    '<div class="hint">共 '+d.length+' 试次 · 正值为沿运动方向的前移</div>'+
    '<div class="statGrid">'+
    '<div class="stat"><div class="k">平均前移量</div><div class="v">'+(all>0?'+':'')+Math.round(all)+'<small>px</small></div></div>'+
    '<div class="stat"><div class="k">速度梯度</div><div class="v">'+
      (groups[0].along!==null&&groups[2].along!==null?
        (groups[2].along>groups[0].along?'↑ 随速度增大':'↓ 未随速度增大'):'—')+'</div></div>'+
    '</div>'+
    '<table><tr><th>速度</th><th>试次</th><th>前移量</th><th>垂直误差</th></tr>'+
    groups.map(function(g){
      return '<tr><td>'+g.s+' px/s</td><td>'+g.n+'</td><td>'+
        (g.along===null?'—':(g.along>0?'+':'')+Math.round(g.along)+'px')+'</td><td>'+
        (g.perp===null?'—':Math.round(g.perp)+'px')+'</td></tr>';
    }).join('')+'</table>';

  if(all>0){
    html+='<div class="note">出现了<b>前移误差</b>：你报告的位置平均比真实消失点沿运动方向多出 '+
      Math.round(all)+' 像素。这正是 Freyd 的表征动量——心理表征不是一帧静止的快照，而是带着“动量”继续前冲。</div>';
  }else{
    html+='<div class="note">平均未出现前移（'+Math.round(all)+'px）。个体差异常见，也可能因为轨迹短、速度不够。'+
      '再做几轮，注意“不要推理轨迹，只凭最后一瞥的位置”。</div>';
  }
  html+='<div class="note"><b>注意：</b>垂直误差是“看准不准”，前移量是“表征有没有惯性”，两者要分开看。'+
    '如果垂直误差很大而前移接近 0，说明你只是没记准位置，而不是没有动量效应。</div>'+
    '<button class="btn" id="e2again">再测一次</button></div>';
  $('#instr').textContent='';
  $('#stage').innerHTML=html;
  $('#e2again').addEventListener('click',e2Intro);
}

/* ============ 实验三：Shepard & Feng (1972) 心理折叠 ============ */
var E3={i:0,total:12,N:6,marks:null,expected:null,selected:null,
  crease:null,orient:null,phase:'idle',data:[],creaseText:''};

function e3Intro(){
  clearAll();
  setPhase('说明');setTrial('—');
  $('#instr').textContent='';
  $('#stage').innerHTML=
    '<div class="method">'+
    '<h3>实验三 · 心理折叠</h3>'+
    '<p><b>程序：</b>一个 6×6 的方格纸上有若干打孔。图中黄色虚线是<b>折线</b>，'+
    '请想象把纸沿虚线对折，然后<b>点击折好后所有有孔的格子</b>。</p>'+
    '<p><b>经典结果：</b>折叠是“反射 + 叠加”的复合变换，比单纯旋转更耗资源；'+
    '当折过来的孔与原孔<b>重叠</b>时，很多人会漏掉或重复计算——因为想象中的两个孔被“合并”成了一个。</p>'+
    '<p><b>共 12 试次</b>，折线方向与位置随机。</p>'+
    '<div class="cite">Shepard, R. N., &amp; Feng, C. (1972). A chronometric study of mental paper folding.</div>'+
    '</div>'+
    '<button class="btn" id="e3start">开始实验</button>';
  $('#e3start').addEventListener('click',function(){
    E3.i=0;E3.data=[];
    setTrial('0/12');
    e3Trial();
  });
}
function e3Trial(){
  clearAll();
  if(E3.i>=E3.total){e3Result();return;}
  var N=E3.N;
  E3.orient=Math.random()<0.5?'v':'h';
  var marks=new Set();
  var nMark=randInt(3,4);
  var guard=0;
  while(marks.size<nMark&&guard++<200){
    marks.add(K(randInt(0,N-1),randInt(0,N-1)));
  }
  E3.marks=marks;

  var c;
  if(E3.orient==='v'){
    c=randInt(3,4);
    E3.crease=c;
    var exp=new Set();
    marks.forEach(function(k){
      var p=pk(k);
      if(p[1]<=c)exp.add(k);
      else exp.add(K(p[0],2*c-p[1]));
    });
    E3.expected=exp;
    E3.creaseText='沿第 '+(c+1)+' 列与第 '+(c+2)+' 列之间的竖线，把<b>右半边</b>折到左边';
  }else{
    c=randInt(3,4);
    E3.crease=c;
    var exp2=new Set();
    marks.forEach(function(k){
      var p=pk(k);
      if(p[0]<=c)exp2.add(k);
      else exp2.add(K(2*c-p[0],p[1]));
    });
    E3.expected=exp2;
    E3.creaseText='沿第 '+(c+1)+' 行与第 '+(c+2)+' 行之间的横线，把<b>下半边</b>折到上边';
  }
  E3.selected=new Set();
  E3.phase='study';
  $('#instr').innerHTML=E3.creaseText+'。先看清打孔位置。';
  renderE3(false);
  after(2500,function(){
    E3.phase='answer';
    $('#instr').innerHTML='点击折好后<b>所有</b>有孔的格子';
    renderE3(true);
  });
}
function renderE3(interactive){
  var N=E3.N;
  var st=$('#stage');
  st.innerHTML='';
  var g=document.createElement('div');
  g.className='grid';g.style.setProperty('--n',N);
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var d=document.createElement('div');
    d.className='cell'+(interactive?' clickable':'');
    d.dataset.k=K(r,c);
    if(E3.marks.has(K(r,c)))d.classList.add('on');
    if(E3.orient==='v'&&c===E3.crease)d.classList.add('creaseV');
    if(E3.orient==='h'&&r===E3.crease)d.classList.add('creaseH');
    g.appendChild(d);
  }
  st.appendChild(g);
  if(interactive){
    var ctrl=document.createElement('div');
    ctrl.className='answers';
    ctrl.innerHTML='<button id="e3sub">提交</button>';
    st.appendChild(ctrl);
    g.addEventListener('click',function(e){
      var cell=e.target.closest('.cell');
      if(!cell)return;
      var k=cell.dataset.k;
      if(E3.selected.has(k)){E3.selected.delete(k);cell.classList.remove('sel');cell.classList.add('on');}
      else{E3.selected.add(k);cell.classList.add('sel');cell.classList.remove('on');}
    });
    $('#e3sub').addEventListener('click',e3Submit);
    var fb=document.createElement('div');
    fb.className='fb';fb.id='e3fb';
    st.appendChild(fb);
  }
}
function e3Submit(){
  if(E3.phase!=='answer')return;
  E3.phase='fb';
  var correct=(E3.selected.size===E3.expected.size);
  if(correct){
    E3.expected.forEach(function(k){if(!E3.selected.has(k))correct=false;});
  }
  var g=$('#stage .grid');
  if(g)g.querySelectorAll('.cell').forEach(function(el){
    var k=el.dataset.k;
    var inSel=E3.selected.has(k),inExp=E3.expected.has(k);
    el.classList.remove('sel','on');
    if(inSel&&inExp)el.classList.add('hit');
    else if(inSel&&!inExp)el.classList.add('err');
    else if(!inSel&&inExp)el.classList.add('miss');
  });
  var sub=$('#e3sub');if(sub)sub.style.display='none';
  var fb=$('#e3fb');
  if(fb){
    fb.className='fb '+(correct?'ok':'bad');
    if(correct)fb.textContent='✓ 完全正确';
    else{
      var miss=0,err=0;
      E3.expected.forEach(function(k){if(!E3.selected.has(k))miss++;});
      E3.selected.forEach(function(k){if(!E3.expected.has(k))err++;});
      fb.textContent='✗ 漏 '+miss+' 格 / 多 '+err+' 格';
    }
  }
  E3.data.push({correct:correct,orient:E3.orient});
  E3.i++;setTrial(E3.i+'/'+E3.total);
  after(1500,e3Trial);
}
function e3Result(){
  clearAll();
  setPhase('结果');
  var d=E3.data;
  if(!d.length){e3Intro();return;}
  var acc=Math.round(d.filter(function(x){return x.correct}).length/d.length*100);
  var v=d.filter(function(x){return x.orient==='v'});
  var h=d.filter(function(x){return x.orient==='h'});
  function rate(a){return a.length?Math.round(a.filter(function(x){return x.correct}).length/a.length*100):null;}
  var html='<div class="res"><h3>结果</h3>'+
    '<div class="hint">共 '+d.length+' 试次</div>'+
    '<div class="statGrid">'+
    '<div class="stat"><div class="k">总体正确率</div><div class="v">'+acc+'<small>%</small></div></div>'+
    '<div class="stat"><div class="k">竖折 / 横折</div><div class="v">'+
      (rate(v)===null?'—':rate(v)+'%')+' / '+(rate(h)===null?'—':rate(h)+'%')+'</div></div>'+
    '</div>'+
    '<div class="note"><b>易错点：</b>两孔折后重叠时，正确答案只有一个格子——但很多人会在脑中“看见两个孔”而多点一次，'+
    '或反过来漏掉。折叠的难点不在反射本身，而在于<b>重叠合并</b>。</div>'+
    '<div class="note"><b>训练意义：</b>折叠是旋转 + 平移 + 集合运算的复合。能在脑中稳定完成它，'+
    '说明你的空间表象不仅能转，还能“操作并合并”。这正是工程制图、折纸、分子构型判断共享的核心能力。</div>'+
    '<button class="btn" id="e3again">再测一次</button></div>';
  $('#instr').textContent='';
  $('#stage').innerHTML=html;
  $('#e3again').addEventListener('click',e3Intro);
}

/* ============ 通用工具 ============ */
function linreg(xs,ys){
  var n=xs.length;if(n<3)return null;
  var mx=xs.reduce(function(a,b){return a+b},0)/n;
  var my=ys.reduce(function(a,b){return a+b},0)/n;
  var num=0,den=0;
  for(var i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)*(xs[i]-mx);}
  if(den===0)return null;
  var b=num/den;
  return {slope:b,intercept:my-b*mx};
}
function svgLine(pts,xlab,ylab){
  var W=400,H=200,padL=48,padR=16,padT=16,padB=34;
  var xs=pts.map(function(p){return p.x});
  var ys=pts.map(function(p){return p.y});
  var xmin=Math.min.apply(null,xs),xmax=Math.max.apply(null,xs);
  var ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys);
  var yr=(ymax-ymin)||1;ymin-=yr*0.15;ymax+=yr*0.15;
  function px(x){return padL+(x-xmin)/((xmax-xmin)||1)*(W-padL-padR);}
  function py(y){return H-padB-(y-ymin)/((ymax-ymin)||1)*(H-padT-padB);}
  var poly=pts.map(function(p){return px(p.x).toFixed(1)+','+py(p.y).toFixed(1)}).join(' ');
  var dots=pts.map(function(p){
    return '<circle cx="'+px(p.x).toFixed(1)+'" cy="'+py(p.y).toFixed(1)+'" r="3.5" fill="#a78bfa"/>';
  }).join('');
  var ticks=pts.map(function(p){
    return '<text x="'+px(p.x).toFixed(1)+'" y="'+(H-padB+14)+'" fill="#5c6f88" font-size="9" text-anchor="middle">'+p.x+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:440px;display:block;margin:0 auto 8px">'+
    '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="#1b2637"/>'+
    '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'" stroke="#1b2637"/>'+
    '<polyline points="'+poly+'" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linejoin="round"/>'+
    dots+ticks+
    '<text x="'+(W/2)+'" y="'+(H-4)+'" fill="#5c6f88" font-size="9" text-anchor="middle">'+xlab+'</text>'+
    '<text x="12" y="'+(H/2)+'" fill="#5c6f88" font-size="9" text-anchor="middle" transform="rotate(-90 12 '+(H/2)+')">'+ylab+'</text>'+
    '</svg>';
}

/* ============ 切换 ============ */
function switchExp(id){
  clearAll();
  document.querySelectorAll('.tab').forEach(function(b){
    b.classList.toggle('active',b.dataset.exp===String(id));
  });
  if(id===1)e1Intro();
  else if(id===2)e2Intro();
  else e3Intro();
}
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){switchExp(Number(b.dataset.exp));});
});
document.addEventListener('keydown',function(e){
  if(E1.phase==='run'){
    if(e.key==='f'||e.key==='F'||e.key==='ArrowLeft'){e.preventDefault();e1Answer(false);}
    if(e.key==='j'||e.key==='J'||e.key==='ArrowRight'){e.preventDefault();e1Answer(true);}
  }
  if(E3.phase==='answer'&&e.key==='Enter'){e.preventDefault();e3Submit();}
});
window.addEventListener('resize',function(){
  if(E1.phase==='run')drawChar();
});
switchExp(1);
</script>
